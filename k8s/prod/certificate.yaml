apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gearworkssmp-com-prod-tls
  namespace: gearworkssmp-com-prod
spec:
  secretName: gearworkssmp-com-prod-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - gearworkssmp.com
    - www.gearworkssmp.com
